name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Run Orchestrator Test Suite
        run: python -B -m unittest discover -s orchestrator/tests -v

      - name: Run Kit Contract & Policy Suites
        run: |
          python -B kit/tests/test_contracts.py
          python -B -I kit/tests/test_rules_block.py
          python -B -I kit/tests/test_policy.py
          python -B -I kit/tests/test_guard.py
          python -B -I kit/tests/test_adapters.py
          python -B -I kit/tests/test_install.py
          python -B -I kit/tests/test_worker_check.py

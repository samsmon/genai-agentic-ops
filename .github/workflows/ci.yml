name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Run Orchestrator Test Suite
        run: python -B -m unittest discover -s orchestrator/tests -v

      # Python suites and the sh suites (*.tests.sh); Git Bash on Windows
      - name: Run kit Python and sh suites
        shell: bash
        run: sh kit/tests/run-tests.sh

      - name: Run kit PowerShell suites
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File kit/tests/run-tests.ps1

      - name: Run OpenCode plugin test
        run: node kit/tests/opencode-plugin.test.mjs

      # The validator refuses to read input where OS no-follow protection is
      # unavailable, so these suites are not run on Windows (known limitation).
      - name: Run security-audit validator tests
        if: runner.os != 'Windows'
        run: |
          node kit/skills/security-audit/validate-findings.test.cjs
          node kit/skills/security-audit/validate-coverage-ledger.test.cjs
